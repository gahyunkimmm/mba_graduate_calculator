<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>연세 CFMBA 졸업이수 시뮬레이터</title>
<style>
:root{
  --blue:#2563EB;--blue-lt:#EFF6FF;--blue-dk:#1D4ED8;
  --green:#059669;--green-lt:#ECFDF5;
  --red:#DC2626;--red-lt:#FEF2F2;
  --amber:#D97706;--amber-lt:#FFFBEB;
  --bg:#F3F4F6;--surface:#fff;--border:#E5E7EB;
  --text:#111827;--sub:#4B5563;--muted:#9CA3AF;
  --r:10px;--r-sm:7px;
  --sh:0 1px 3px rgba(0,0,0,.08);
  --sh-md:0 4px 16px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.55}

/* ════════════════ TOPBAR ════════════════ */
#topbar{
  position:fixed;top:0;left:50%;transform:translateX(-50%);
  width:min(840px,calc(100vw - .5rem));z-index:200;
  background:var(--surface);border:1px solid var(--border);
  border-radius:0 0 14px 14px;
  box-shadow:var(--sh-md);
  overflow:hidden;
}
#tb-row1{
  display:flex;align-items:center;gap:10px;
  padding:10px 16px 8px;
}
#tb-brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
#tb-logo{font-size:1.1rem;font-weight:800;color:var(--blue);letter-spacing:-.3px}
#tb-prog{display:flex;background:#F3F4F6;border-radius:20px;padding:2px}
.pb{border:none;background:transparent;padding:4px 11px;border-radius:18px;
  font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);transition:all .18s}
.pb.on{background:var(--blue);color:#fff;box-shadow:0 2px 6px rgba(37,99,235,.4)}
#tb-cr{flex:1;min-width:0}
#tb-cr-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
#tb-cr-lbl{font-size:11px;color:var(--muted)}
#tb-cr-val{font-weight:800;font-size:14px;color:var(--blue);letter-spacing:-.3px;white-space:nowrap}
#tb-track{background:#E5E7EB;border-radius:4px;height:5px}
#tb-fill{height:100%;border-radius:4px;width:0%;background:var(--blue);transition:width .4s ease}
#tb-actions{display:flex;gap:7px;flex-shrink:0}
.tb-btn{border:none;cursor:pointer;font-weight:700;border-radius:var(--r-sm);
  font-size:12px;padding:6px 11px;transition:all .18s;white-space:nowrap}
#btn-share{background:var(--blue-lt);color:var(--blue)}
#btn-share:hover{background:var(--blue);color:#fff}
#btn-report{background:var(--blue);color:#fff}
#btn-report:hover{background:var(--blue-dk)}

/* tabs */
#tb-nav{
  display:flex;border-top:1px solid var(--border);
}
.nb{flex:1;border:none;background:transparent;cursor:pointer;
  font-size:12px;font-weight:600;padding:8px 4px;color:var(--muted);
  border-bottom:2px solid transparent;transition:all .18s;text-align:center}
.nb.on{color:var(--blue);border-bottom-color:var(--blue)}
.nb:hover:not(.on){color:var(--sub)}

/* ════════════════ APP CONTAINER ════════════════ */
#app{max-width:840px;margin:0 auto;padding:88px 14px 56px}

/* ════════════════ PROGRAM SELECT ════════════════ */
.prog-sel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.prog-btn{padding:10px;border-radius:var(--r);border:2px solid var(--border);
  background:var(--surface);cursor:pointer;font-size:14px;font-weight:700;
  transition:all .18s;color:var(--muted)}
.prog-btn.on{border-color:var(--blue);color:var(--blue);background:var(--blue-lt)}

/* ════════════════ CAPTION ════════════════ */
.caption{font-size:11.5px;color:var(--muted);margin-bottom:12px;
  line-height:1.6;padding:9px 12px;background:#F9FAFB;
  border-radius:var(--r-sm);border-left:3px solid #D1D5DB}

/* ════════════════ ACCORDION ════════════════ */
details{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);margin-bottom:8px;
  box-shadow:var(--sh);transition:box-shadow .2s;
}
details[open]{box-shadow:var(--sh-md)}
summary{
  padding:12px 16px;cursor:pointer;list-style:none;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  border-radius:var(--r);
}
summary::-webkit-details-marker{display:none}
.sum-left{display:flex;flex-direction:column;gap:1px;min-width:0}
.sum-title{font-weight:700;font-size:13px;color:var(--text)}
.sum-stat{font-size:11px;color:var(--muted)}
.sum-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.sum-cr{font-weight:800;font-size:13px;color:var(--blue)}
.sum-arrow{font-size:9px;color:var(--muted);transition:transform .2s}
details[open] .sum-arrow{transform:rotate(180deg)}
.sem-body{padding:0 16px 14px;border-top:1px solid #F3F4F6}

/* ════════════════ SECTION HEADERS ════════════════ */
.sub-hd{
  font-size:11px;font-weight:700;color:var(--sub);
  margin:12px 0 4px;padding:4px 10px;
  background:#F9FAFB;border-radius:var(--r-sm);
  display:flex;align-items:center;gap:5px;
}
.track-hd{
  font-size:11px;font-weight:600;color:var(--muted);
  margin:8px 0 2px;padding-left:8px;
  border-left:2px solid #E5E7EB;
}

/* ════════════════ CHECKBOX ROWS ════════════════ */
.cr{display:flex;align-items:flex-start;gap:8px;padding:3px 2px;
  border-radius:var(--r-sm);transition:background .12s}
.cr:hover{background:#F9FAFB}
.cr input[type=checkbox]{
  margin-top:2px;flex-shrink:0;
  width:16px;height:16px;cursor:pointer;accent-color:var(--blue);
  border-radius:4px;
}
.cr label{font-size:13px;cursor:pointer;line-height:1.45;color:var(--text)}
.cr.lk label{color:var(--muted)}
.cr input:disabled{cursor:not-allowed}
.cr-badge{
  display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;
  border-radius:10px;margin-left:4px;vertical-align:middle;
}
.badge-eng{background:#EEF2FF;color:#4338CA}
.badge-ld{background:#F0FDF4;color:#15803D}
.badge-both{background:#FFF7ED;color:#C2410C}

/* ════════════════ RADIO (count-as) ════════════════ */
.count-as{
  margin:3px 0 2px 24px;display:flex;gap:14px;font-size:12px;
  padding:5px 10px;background:var(--amber-lt);border-radius:var(--r-sm);
  align-items:center;
}
.count-as>span{color:var(--amber);font-weight:600;font-size:11px}
.count-as label{display:flex;align-items:center;gap:4px;cursor:pointer;color:var(--sub)}

/* ════════════════ CREDIT CAP BADGE ════════════════ */
.cap-warn{
  display:inline-block;padding:2px 8px;font-size:10px;font-weight:700;
  border-radius:10px;margin-left:6px;
}
.cap-full{background:#FEF2F2;color:var(--red)}
.cap-left{background:#EFF6FF;color:var(--blue)}

/* ════════════════ REPORT ════════════════ */
.banner{border-radius:var(--r);padding:16px 20px;margin:0 0 16px}
.banner-ok{background:var(--green-lt);border:1.5px solid var(--green)}
.banner-ng{background:var(--red-lt);border:1.5px solid var(--red)}
.banner-title{font-size:1.1rem;font-weight:800}
.banner-ok .banner-title{color:#065F46}
.banner-ng .banner-title{color:#991B1B}
.banner-sub{font-size:.85rem;margin-top:3px}
.banner-ok .banner-sub{color:var(--green)}
.banner-ng .banner-sub{color:var(--muted)}

.mcards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 16px}
.mc{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:12px 8px;text-align:center;
  box-shadow:var(--sh);
}
.mc-icon{font-size:1.3rem;margin-bottom:4px}
.mc-lbl{font-size:10px;color:var(--muted);margin-bottom:3px;word-break:keep-all;line-height:1.3}
.mc-val{font-size:1.15rem;font-weight:800;color:var(--text);line-height:1.1}
.mc-sub{display:inline-block;border-radius:6px;padding:2px 6px;
  font-size:10px;font-weight:600;margin-top:4px;word-break:keep-all}
.mc-sub.ok{background:var(--green-lt);color:var(--green)}
.mc-sub.ng{background:var(--red-lt);color:var(--red)}

.rr-grid{display:grid;gap:7px;margin:14px 0}
.rr{
  border-radius:var(--r);padding:11px 14px;
  display:flex;align-items:flex-start;gap:10px;
  background:var(--surface);border:1px solid var(--border);
}
.rr.ok{border-left:3px solid var(--green)}
.rr.ng{border-left:3px solid var(--red)}
.rr-icon{font-size:1.1rem;flex-shrink:0;margin-top:1px}
.rr-body{flex:1;min-width:0}
.rr-title{font-weight:700;font-size:13px}
.rr.ok .rr-title{color:#065F46}
.rr.ng .rr-title{color:#991B1B}
.rr-detail{font-size:11.5px;color:var(--muted);margin-top:2px;word-break:break-all}
.rr-pct{flex-shrink:0;font-size:12px;font-weight:800;color:var(--blue)}

.pw{background:#E5E7EB;border-radius:4px;height:6px;margin:4px 0}
.pf{height:100%;border-radius:4px;background:var(--blue);transition:width .4s}
.pf.full{background:var(--green)}

.conc-card{
  border-radius:var(--r);padding:12px 16px;margin:6px 0;
  background:var(--surface);border:1px solid var(--border);
}
.conc-ach{border:1.5px solid var(--green);background:var(--green-lt)}
.conc-ach-t{font-weight:800;font-size:.95rem;color:#065F46}
.conc-ach-s{font-size:.83rem;color:var(--green);margin-top:2px}
.conc-row{display:flex;justify-content:space-between;align-items:baseline;
  font-size:13px;margin-bottom:4px}
.conc-name{color:var(--text);font-weight:600}
.conc-val{color:var(--sub)}

/* ════════════════ SECTION TITLE ════════════════ */
.sec-title{
  font-size:14px;font-weight:800;color:var(--text);
  margin:20px 0 10px;display:flex;align-items:center;gap:6px;
}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* ════════════════ TABLE ════════════════ */
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#F9FAFB;padding:6px 8px;text-align:left;
  border-bottom:2px solid var(--border);font-weight:700;color:var(--sub)}
td{padding:6px 8px;border-bottom:1px solid #F3F4F6;color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:#F9FAFB}

/* ════════════════ BUTTONS ════════════════ */
.btn{
  padding:11px 14px;border-radius:var(--r);border:none;cursor:pointer;
  font-size:13px;font-weight:700;width:100%;text-align:center;
  transition:all .18s;
}
.btn-p{background:var(--blue);color:#fff}
.btn-p:hover{background:var(--blue-dk);transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.35)}
.btn-d{background:var(--red-lt);border:1.5px solid var(--red);color:var(--red)}
.btn-d:hover{background:#FCA5A5;color:#fff}
.btn-g{background:#F3F4F6;color:var(--sub);border:1.5px solid var(--border)}
.btn-g:hover{background:var(--border)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.btn-full{margin:14px 0}

hr{border:none;border-top:1px solid var(--border);margin:16px 0}

/* ════════════════ TOAST ════════════════ */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:#1F2937;color:#fff;padding:10px 20px;border-radius:30px;
  font-size:13px;font-weight:600;z-index:9999;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s;
  opacity:0;pointer-events:none;white-space:nowrap;
}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ════════════════ SHARE LOADED BANNER ════════════════ */
#shared-notice{
  display:none;background:#EFF6FF;border:1.5px solid #BFDBFE;
  border-radius:var(--r);padding:10px 14px;margin-bottom:12px;
  font-size:12.5px;color:#1E40AF;
}
#shared-notice strong{font-weight:700}

/* ════════════════ RESPONSIVE ════════════════ */
@media(max-width:600px){
  #app{padding:84px 10px 48px}
  #tb-brand{gap:7px}
  #tb-logo{font-size:.95rem}
  .mcards{grid-template-columns:repeat(2,1fr)}
  .btn-row{grid-template-columns:1fr}
  .mc{padding:10px 4px}
  .mc-val{font-size:1rem}
  table{font-size:11px}
  #tb-actions .tb-btn{font-size:11px;padding:5px 8px}
}
@media(max-width:420px){
  #tb-cr{display:none}
  .mcards{gap:5px}
}
</style>
</head>
<body>

<!-- ══ TOPBAR ══ -->
<div id="topbar">
  <div id="tb-row1">
    <div id="tb-brand">
      <span id="tb-logo">🎓 연세 CFMBA</span>
      <div id="tb-prog">
        <button class="pb on" id="pb-CMBA" onclick="setProg('CMBA')">CMBA</button>
        <button class="pb"    id="pb-FMBA" onclick="setProg('FMBA')">FMBA</button>
      </div>
    </div>
    <div id="tb-cr">
      <div id="tb-cr-top">
        <span id="tb-cr-lbl">이수학점</span>
        <span id="tb-cr-val">0 / 45</span>
      </div>
      <div id="tb-track"><div id="tb-fill"></div></div>
    </div>
    <div id="tb-actions">
      <button class="tb-btn" id="btn-share" onclick="shareURL()">🔗 공유</button>
      <button class="tb-btn" id="btn-report" onclick="goReport()">리포트 →</button>
    </div>
  </div>
  <div id="tb-nav">
    <button class="nb on" id="nb-plan"   onclick="goView('plan')">📋 이수계획</button>
    <button class="nb"    id="nb-report" onclick="goView('report')">📊 졸업진단 리포트</button>
  </div>
</div>

<div id="app">

  <!-- 공유 링크로 접속 시 안내 -->
  <div id="shared-notice">
    <strong>📤 공유된 이수계획을 불러왔습니다.</strong>
    내 플랜으로 저장하려면 과목을 체크/해제하거나 그대로 두세요.
    변경 즉시 내 브라우저에 저장됩니다.
  </div>

  <!-- ── 이수계획 뷰 ── -->
  <div id="v-plan">
    <div class="prog-sel">
      <button class="prog-btn on" id="plan-pb-CMBA" onclick="setProg('CMBA')">CMBA</button>
      <button class="prog-btn"    id="plan-pb-FMBA" onclick="setProg('FMBA')">FMBA</button>
    </div>
    <p class="caption">각 학기를 펼쳐 필수 · 선택과목을 확인하고 이수 여부를 체크하세요.
    &nbsp;📱 LearnUs → 나의강좌 → 과거강좌조회</p>
    <div id="plan-body"></div>
    <hr>
    <div class="btn-full">
      <button class="btn btn-p" onclick="goReport()">✅ 졸업진단 리포트 보기 →</button>
    </div>
  </div>

  <!-- ── 졸업진단 리포트 뷰 ── -->
  <div id="v-report" class="hidden"></div>
</div>

<!-- Toast -->
<div id="toast">🔗 링크가 복사됐습니다!</div>

<style>.hidden{display:none!important}</style>

let prog  = 'CMBA';
let taken = {};
let loadedFromShare = false;

function loadFromHash(){
  const h = location.hash;
  if(!h.startsWith('#plan=')) return false;
  try{
    const raw = decodeURIComponent(escape(atob(h.slice(6))));
    const st  = JSON.parse(raw);
    if(st.p) prog  = st.p;
    if(st.t) taken = st.t;
    // Also save to localStorage so it persists
    save();
    return true;
  }catch(e){ return false; }
}

function loadFromStorage(){
  prog  = localStorage.getItem('prog') || 'CMBA';
  taken = {};
  try{ taken = JSON.parse(localStorage.getItem('taken')||'{}'); }catch(e){}
}

// Init: hash takes priority over localStorage
loadedFromShare = loadFromHash();
if(!loadedFromShare) loadFromStorage();

function save(){
  localStorage.setItem('prog',prog);
  localStorage.setItem('taken',JSON.stringify(taken));
  // Update hash silently
  const encoded = btoa(unescape(encodeURIComponent(JSON.stringify({p:prog,t:taken}))));
  history.replaceState(null,'','#plan='+encoded);
}

// ═══════════════════════════════════════════════════════
//  URL SHARING
// ═══════════════════════════════════════════════════════
function shareURL(){
  const encoded = btoa(unescape(encodeURIComponent(JSON.stringify({p:prog,t:taken}))));
  const url = location.origin + location.pathname + '#plan=' + encoded;
  navigator.clipboard.writeText(url).then(()=>showToast('🔗 링크가 복사됐습니다!')).catch(()=>{
    // Fallback
    const ta=document.createElement('textarea');
    ta.value=url; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast('🔗 링크가 복사됐습니다!');
  });
}

let toastTimer=null;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2500);
}

//  HELPERS
// ═══════════════════════════════════════════════════════
const fc = n => n%1===0 ? String(n) : n.toFixed(1);

function stats(){
  let tot=0,eng=0,ld=0;
  for(const v of Object.values(taken)){
    tot+=v.credits;
    if(v.is_english)    eng+=v.credits;
    if(v.is_leadership) ld +=v.credits;
  }
  const rq   = MASTER.required[prog];
  const miss = rq.filter(c=>!taken[c.code]);
  return {tot,eng,ld,miss,rq};
}

function updateBar(){
  const {tot,miss,eng,ld} = stats();
  const rules = MASTER.graduation_rules[prog];
  const pct   = Math.min(tot/rules.total_credits*100,100);
  const done  = tot>=rules.total_credits && !miss.length && eng>=rules.english_credits && ld>=rules.leadership_credits;
  const color = done ? 'var(--green)' : (tot>=rules.total_credits ? 'var(--amber)' : 'var(--blue)');
  document.getElementById('tb-cr-val').textContent = `${fc(tot)} / ${rules.total_credits}`;
  document.getElementById('tb-cr-val').style.color = done ? 'var(--green)' : 'var(--blue)';
  document.getElementById('tb-fill').style.width  = pct+'%';
  document.getElementById('tb-fill').style.background = color;
}

  view=v;

  document.getElementById('v-plan')  .classList.toggle('hidden',!isPlan);
  document.getElementById('v-report').classList.toggle('hidden', isPlan);
  document.getElementById('btn-report').classList.toggle('hidden', !isPlan);
  document.getElementById('nb-plan')  .classList.toggle('on',isPlan);
  document.getElementById('nb-report').classList.toggle('on',!isPlan);
  window.scrollTo({top:0,behavior:'smooth'});
  if(isPlan) renderPlan(); else renderReport();
}

function setProg(p){
  prog=p;
  save();
  ['CMBA','FMBA'].forEach(x=>{
    document.getElementById('pb-'+x).classList.toggle('on',x===p);
    document.getElementById('plan-pb-'+x).classList.toggle('on',x===p);
  });
  renderPlan();
}

//  PLAN RENDER
// ═══════════════════════════════════════════════════════
let elecMap={};

function renderPlan(){
  elecMap={};
  const reqSet = new Set(MASTER.required[prog].map(c=>c.code));
  const frags  = [];

  SEM_CFG[prog].forEach((sem,si)=>{
    const {label,rk,sn,reg}=sem;
    const semReq = MASTER.required[prog].filter(c=>rk.includes(c.semester));

    let semElec=[];
    if(sn){
      semElec = Object.values(SE[sn]).filter(c=>!reqSet.has(c.code)).map(c=>({...c,semIdx:si,once:true}));
      if(sn==='여름') semElec.push({...CKJ,semIdx:si,once:true});
      semElec.push({...GST,semIdx:si,once:true});
    } else {
      if(reg && RE[reg]) semElec = Object.values(RE[reg]).filter(c=>!reqSet.has(c.code)).map(c=>({...c,semIdx:si,once:true}));
      semElec.push(...LDR.map(lc=>({...lc,semIdx:si})));
    }

    if(!semReq.length && !semElec.length) return;

    const isHere = c => {
      const r=taken[c.code];
      if(!r) return false;
      return c.once ? r.sem_idx===si : true;
    };

    let snCr = sn ? semElec.filter(c=>isHere(c)&&!CAP_EXEMPT.has(c.code)).reduce((s,c)=>s+taken[c.code].credits,0) : 0;

    const cReq  = semReq.filter(c=>taken[c.code]).length;
    const cElec = semElec.filter(c=>isHere(c)).length;
    const crDone= semReq.filter(c=>taken[c.code]).reduce((s,c)=>s+taken[c.code].credits,0)
                + semElec.filter(c=>isHere(c)).reduce((s,c)=>s+taken[c.code].credits,0);

    const doneAll = semReq.length>0 && cReq===semReq.length;

    // Track buckets
    const bk={};
    for(const c of semElec){
      const tr = prog==='CMBA' ? c.cmba_track : c.fmba_track;
      const key = tr ? `심화 · ${tr}` : (c.is_leadership||c.is_english) ? '영어 / 리더십개발' : '기타 선택';
      if(!bk[key]) bk[key]=[];
      bk[key].push(c);
    }
    const tOrd = [...Object.keys(bk).filter(k=>k.startsWith('심화')).sort(),'영어 / 리더십개발','기타 선택'].filter(k=>bk[k]);

    const statStr = `필수 ${cReq}/${semReq.length}${semElec.length?` · 선택 ${cElec}과목`:''}`;

    let h=`<details open><summary>
  <div class="sum-left">
    <span class="sum-title">${label}</span>
    <span class="sum-stat">${statStr}</span>
  </div>
  <div class="sum-right">
    ${crDone>0?`<span class="sum-cr">${fc(crDone)}학점</span>`:''}
    <span class="sum-arrow">▾</span>
  </div>
</summary><div class="sem-body">`;

    // 필수
    if(semReq.length){
      h+=`<div class="sub-hd">📌 필수과목</div>`;
      for(const c of semReq){
        const id=`req_${c.code}`;
        const chk=taken[c.code]?'checked':'';
        h+=`<div class="cr"><input type="checkbox" id="${id}" ${chk} onchange="toggleReq('${c.code}','${c.name.replace(/'/g,"\\'")}',${c.credits})"><label for="${id}"><strong>${c.name}</strong> <span style="color:var(--muted)">· ${c.credits}학점</span></label></div>`;
      }
    }

    // 선택
    if(semElec.length){
      let capBadge='';
      if(sn){
        if(snCr>=CAP) capBadge=`<span class="cap-warn cap-full">상한 도달</span>`;
        else capBadge=`<span class="cap-warn cap-left">잔여 ${fc(CAP-snCr)}학점</span>`;
      }
      h+=`<div class="sub-hd">🗂️ 선택과목${capBadge}</div>`;

      for(const trLabel of tOrd){
        const cl=bk[trLabel];
        const cnt=cl.filter(c=>isHere(c)).length;
        h+=`<div class="track-hd">${trLabel} · <span style="color:var(--blue)">${cnt}/${cl.length}</span>과목</div>`;

        snCr = sn ? semElec.filter(c=>isHere(c)&&!CAP_EXEMPT.has(c.code)).reduce((s,c)=>s+taken[c.code].credits,0) : 0;

        for(const c of cl){
          const mapKey=`elec_s${si}_${c.code}`;
          elecMap[mapKey]=c;

          const rec     = taken[c.code];
          const here    = isHere(c);
          const onceLk  = !!(c.once && rec && rec.sem_idx!==si);
          const capLk   = !!(sn && !CAP_EXEMPT.has(c.code) && !here && snCr+c.credits>CAP);
          const lk      = onceLk||capLk;

          let badge='';
          if(c.is_english&&c.is_leadership) badge=`<span class="cr-badge badge-both">영어/리더십</span>`;
          else if(c.is_english)              badge=`<span class="cr-badge badge-eng">영어강의</span>`;
          else if(c.is_leadership)           badge=`<span class="cr-badge badge-ld">리더십개발</span>`;

          h+=`<div class="cr${lk?' lk':''}">
<input type="checkbox" id="${mapKey}" ${here?'checked':''} ${lk?'disabled':''} ${!lk?`onchange="toggleElec('${mapKey}')"`:''}>
<label for="${mapKey}"><strong>${c.name}</strong> <span style="color:var(--muted)">· ${c.credits}학점</span>${badge}${lk?' <span style="color:var(--muted)">🔒</span>':''}</label>
</div>`;

          if(here && !lk && c.is_english && c.is_leadership){
            const asEng = rec&&rec.is_english ? 'checked':'';
            const asLd  = rec&&rec.is_leadership ? 'checked':'';
            h+=`<div class="count-as"><span>어느 요건?</span>
<label><input type="radio" name="as_${mapKey}" value="영어강의" ${asEng} onchange="setCountAs('${c.code}','영어강의')"> 영어강의</label>
<label><input type="radio" name="as_${mapKey}" value="리더십개발" ${asLd} onchange="setCountAs('${c.code}','리더십개발')"> 리더십개발</label>
</div>`;
          }
        }
      }
    }
    h+=`</div></details>`;
    frags.push(h);
  });

  document.getElementById('plan-body').innerHTML = frags.join('');
  updateBar();
}

// ═══════════════════════════════════════════════════════
//  TOGGLE HANDLERS
// ═══════════════════════════════════════════════════════
function toggleReq(code,name,credits){
  const el=document.getElementById('req_'+code);
  if(el.checked) taken[code]={name,credits,kind:'필수',is_english:false,is_leadership:false};
  else if(taken[code]&&taken[code].kind==='필수') delete taken[code];
  save(); renderPlan();
}

function toggleElec(key){
  const c=elecMap[key];
  if(!c){ renderPlan(); return; }
  const el=document.getElementById(key);
  if(el.checked){
    taken[c.code]={
      name:c.name, credits:c.credits, kind:'선택',
      is_english:!!c.is_english, is_leadership:!!c.is_leadership,
      once:!!c.once, sem_idx:c.semIdx,
      cmba_track:c.cmba_track||null, fmba_track:c.fmba_track||null
    };
  } else {
    if(taken[c.code]&&taken[c.code].kind==='선택') delete taken[c.code];
  }
  save(); renderPlan();
}

function setCountAs(code,val){
  if(!taken[code]) return;
  taken[code].is_english    = (val==='영어강의');
  taken[code].is_leadership = (val==='리더십개발');
  save();
}

// ═══════════════════════════════════════════════════════
//  REPORT RENDER
// ═══════════════════════════════════════════════════════
function renderReport(){
  const rules=MASTER.graduation_rules[prog];
  const {tot,eng,ld,miss,rq}=stats();
  const allOk=tot>=rules.total_credits && !miss.length && eng>=rules.english_credits && ld>=rules.leadership_credits;

  let h='';

  // 배너
  if(allOk){
    h+=`<div class="banner banner-ok">
<div class="banner-title">🎓 졸업 요건 충족!</div>
<div class="banner-sub">모든 요건을 충족했습니다. 축하합니다!</div>
</div>`;
  } else {
    const iss=[];
    if(tot<rules.total_credits)       iss.push(`학점 ${fc(rules.total_credits-tot)}학점 부족`);
    if(miss.length)                   iss.push(`필수과목 ${miss.length}개 미이수`);
    if(eng<rules.english_credits)     iss.push(`영어강의 ${fc(rules.english_credits-eng)}학점 부족`);
    if(ld<rules.leadership_credits)   iss.push(`리더십개발 ${fc(rules.leadership_credits-ld)}학점 부족`);
    h+=`<div class="banner banner-ng">
<div class="banner-title">❌ 졸업 요건 미충족</div>
<div class="banner-sub">미충족 항목: ${iss.join(' &middot; ')}</div>
</div>`;
  }

  // 메트릭 카드
  h+=`<div class="mcards">
<div class="mc">
  <div class="mc-icon">📚</div>
  <div class="mc-lbl">총 이수학점</div>
  <div class="mc-val">${fc(tot)}학점</div>
  <div class="mc-sub ${tot>=rules.total_credits?'ok':'ng'}">목표 ${rules.total_credits}학점</div>
</div>
<div class="mc">
  <div class="mc-icon">📌</div>
  <div class="mc-lbl">필수 미이수</div>
  <div class="mc-val">${miss.length}과목</div>
  <div class="mc-sub ${miss.length===0?'ok':'ng'}">${rq.length-miss.length}/${rq.length} 완료</div>
</div>
<div class="mc">
  <div class="mc-icon">🌐</div>
  <div class="mc-lbl">영어강의</div>
  <div class="mc-val">${fc(eng)}학점</div>
  <div class="mc-sub ${eng>=rules.english_credits?'ok':'ng'}">기준 ${rules.english_credits}학점</div>
</div>
<div class="mc">
  <div class="mc-icon">🏃</div>
  <div class="mc-lbl">리더십개발</div>
  <div class="mc-val">${fc(ld)}학점</div>
  <div class="mc-sub ${ld>=rules.leadership_credits?'ok':'ng'}">기준 ${rules.leadership_credits}학점</div>
</div>
</div>`;

  // 요건 체크리스트
  h+=`<div class="sec-title">졸업 요건 상세</div><div class="rr-grid">`;

  const pct2 = (v,mx) => {
    const p = Math.min(v/mx*100,100);
    return `<div class="pw" style="margin-top:5px"><div class="pf${v>=mx?' full':''}" style="width:${p}%"></div></div>`;
  };

  const rrItem = (ok2,title,sub,pctHtml='') =>
    `<div class="rr ${ok2?'ok':'ng'}">
      <div class="rr-icon">${ok2?'✅':'❌'}</div>
      <div class="rr-body">
        <div class="rr-title">${title}</div>
        ${sub?`<div class="rr-detail">${sub}</div>`:''}
        ${pctHtml}
      </div>
    </div>`;

  h+=rrItem(tot>=rules.total_credits,
    `총 이수학점 ${fc(tot)} / ${rules.total_credits}학점`,
    null,
    pct2(tot,rules.total_credits));
  h+=rrItem(miss.length===0,
    `필수과목 ${rq.length-miss.length}/${rq.length}과목 이수`,
    miss.length ? '미이수: '+miss.map(c=>`<strong>${c.name}</strong>`).join(', ') : '');
  h+=rrItem(eng>=rules.english_credits,
    `영어강의 ${fc(eng)} / ${rules.english_credits}학점`,
    null,
    pct2(eng,rules.english_credits));
  h+=rrItem(ld>=rules.leadership_credits,
    `리더십개발 ${fc(ld)} / ${rules.leadership_credits}학점`,
    null,
    pct2(ld,rules.leadership_credits));
  h+=`</div>`;

  // 심화과정
  h+=`<div class="sec-title">심화과정 (Concentration)</div>`;
  const ci=MASTER.concentration_index[prog];

  if(prog==='CMBA'){
    const conc={};
    for(const [code,v] of Object.entries(taken))
      for(const tr of (ci[code]||[])) conc[tr]=(conc[tr]||0)+v.credits;
    for(const tr of ['마케팅','매니지먼트','재무']){
      const cr=conc[tr]||0, ok2=cr>=rules.concentration_credits;
      const pct=Math.min(cr/rules.concentration_credits*100,100);
      if(ok2){
        h+=`<div class="conc-card conc-ach">
<div class="conc-ach-t">🏆 ${tr} 심화과정 인정</div>
<div class="conc-ach-s">${fc(cr)} / ${rules.concentration_credits}학점 달성</div>
</div>`;
      } else {
        h+=`<div class="conc-card">
<div class="conc-row"><span class="conc-name">${tr}</span><span class="conc-val">${fc(cr)} / ${rules.concentration_credits}학점</span></div>
<div class="pw"><div class="pf" style="width:${pct}%"></div></div>
</div>`;
      }
    }
  } else {
    const sums={'금융공학':0,'자산운용/투자은행':0,'공통트랙':0};
    for(const [code,v] of Object.entries(taken))
      for(const tr of (ci[code]||[])) sums[tr]=(sums[tr]||0)+v.credits;
    for(const [tr,cr] of Object.entries(sums)){
      const pct=Math.min(cr/rules.concentration_credits*100,100);
      h+=`<div class="conc-card">
<div class="conc-row"><span class="conc-name">${tr}</span><span class="conc-val">${fc(cr)}학점</span></div>
<div class="pw"><div class="pf" style="width:${pct}%"></div></div>
</div>`;
    }
    const fe=sums['금융공학'],ib=sums['자산운용/투자은행'],cm=sums['공통트랙'];
    const ach=[];
    if(fe>=9) ach.push(`금융공학 (${fc(fe)}학점)`);
    else if(fe+cm>=9&&fe>0) ach.push(`금융공학 + 공통트랙 (${fc(fe+cm)}학점)`);
    if(ib+cm>=9&&ib>0) ach.push(`자산운용/투자은행 + 공통트랙 (${fc(ib+cm)}학점)`);
    for(const a of ach) h+=`<div class="conc-card conc-ach"><div class="conc-ach-t">🏆 심화과정 인정</div><div class="conc-ach-s">${a}</div></div>`;
    if(!ach.length) h+=`<p style="color:var(--muted);font-size:13px;margin:6px 0;text-align:center">아직 인정 기준을 충족한 조합이 없습니다.</p>`;
    h+=`<p style="font-size:11px;color:var(--muted);margin-top:10px;padding:8px 10px;background:#F9FAFB;border-radius:var(--r-sm)">📖 ${MASTER.fmba_concentration_note}</p>`;
  }

  // 과목 테이블
  const entries=Object.entries(taken);
  h+=`<div class="sec-title">담은 과목 (${entries.length}과목 · ${fc(tot)}학점)</div>`;
  h+=`<details><summary style="font-size:13px;font-weight:600;cursor:pointer;list-style:none;padding:4px 0;color:var(--sub)">전체 목록 펼치기 ▾</summary>`;
  if(entries.length){
    h+=`<div style="overflow-x:auto;margin-top:8px"><table><thead><tr><th>학정번호</th><th>과목명</th><th>학점</th><th>종별</th><th>영어</th><th>리더십</th></tr></thead><tbody>`;
    for(const [code,v] of entries)
      h+=`<tr><td style="color:var(--muted)">${code}</td><td>${v.name}</td><td>${v.credits}</td><td>${v.kind||''}</td><td>${v.is_english?'✓':''}</td><td>${v.is_leadership?'✓':''}</td></tr>`;
    h+='</tbody></table></div>';
  } else {
    h+=`<p style="color:var(--muted);font-size:13px;padding:8px 0">아직 담은 과목이 없습니다.</p>`;
  }
  h+='</details>';

  // 버튼
  h+=`<div class="btn-row" style="margin-top:20px">
<button class="btn btn-p" onclick="goView('plan')">← 이수계획으로 돌아가기</button>
<button class="btn btn-d" onclick="resetAll()">🗑️ 전체 초기화</button>
</div>
<div class="btn-full" style="margin-top:0">
<button class="btn btn-g" onclick="shareURL()">🔗 이 플랜 링크 공유하기</button>
</div>`;

  document.getElementById('v-report').innerHTML=h;
}

// ═══════════════════════════════════════════════════════
//  RESET
// ═══════════════════════════════════════════════════════
function resetAll(){
  if(!confirm('모든 이수 데이터를 초기화할까요?')) return;
  taken={}; save(); goView('plan');
}

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
if(loadedFromShare){
  document.getElementById('shared-notice').style.display='block';
}
['CMBA','FMBA'].forEach(p=>{
  document.getElementById('pb-'+p).classList.toggle('on',p===prog);
  document.getElementById('plan-pb-'+p).classList.toggle('on',p===prog);
});
goView('plan');
</script>
